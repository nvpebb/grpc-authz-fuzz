syntax = "proto3";

package grpc_authz_fuzz;

import "sequence.proto";

option cc_enable_arenas = true;

// Parent → worker: one Sequence job.
message WorkerJob {
  uint64 job_id = 1;
  Sequence sequence = 2;
}

// Worker → parent: short execution result (coverage lives in SHM).
message WorkerResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    OK = 1;
    TARGET_ERROR = 2;
    INTERNAL_ERROR = 3;
  }

  uint64 job_id = 1;
  Status status = 2;
  string error_message = 3;
  uint32 steps_executed = 4;
  uint32 coverage_bits_set = 5;  // stub metric from local SHM after the job
}
